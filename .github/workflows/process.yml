name: process

# Only the dispatch sent by the relay and manual runs.
# No pull_request / pull_request_target / fork-reachable triggers.
on:
  repository_dispatch:
    types: [process_audio]
  workflow_dispatch:
    inputs:
      selftest:
        description: Load the model and exit, to verify the environment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # queue: max, NOT cancel-in-progress. These are not two spellings of the same
  # thing. The default (queue: single) allows only one *pending* run per group,
  # and a newly queued run cancels the existing pending one - so a burst of
  # watch uploads would run two files and silently drop every other one, with no
  # error anywhere. queue: max lets up to 100 runs wait their turn in FIFO
  # order. It cannot be combined with cancel-in-progress, which is why that key
  # is gone rather than set to false.
  group: process-audio
  queue: max

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ffmpeg
        run: |
          set +x
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache model weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            pretrained_models
            ~/.cache/huggingface
            ~/.cache/torch
          # Bumped whenever the model set changes. A cache hit is restored but
          # never re-saved, so adding weights without a new key means they
          # re-download on every single run.
          key: models-v3

      - name: Install CPU-only torch
        run: |
          set +x
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch==2.2.2 torchaudio==2.2.2 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          set +x
          python -m pip install --quiet -r requirements.txt

      - name: Process
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          VOICE_EMBEDDING: ${{ secrets.VOICE_EMBEDDING }}
          MATCH_THRESHOLD: ${{ vars.MATCH_THRESHOLD }}
          TRANSCRIBE: ${{ vars.TRANSCRIBE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          # The private transcript archive. Optional: with these unset,
          # archive_transcript() returns immediately and the run is unchanged.
          # Both are secrets rather than variables so the runner masks them.
          # ARCHIVE_SSH_KEY is the private half of a deploy key scoped to the
          # archive repository alone - it cannot read or write any other
          # repository, and it is not a personal access token. ARCHIVE_REPO is
          # not a credential, but it names the private repository, and this log
          # is world-readable.
          ARCHIVE_SSH_KEY: ${{ secrets.ARCHIVE_SSH_KEY }}
          ARCHIVE_REPO: ${{ secrets.ARCHIVE_REPO }}
          # The dispatch payload is read from the event file, never from here.
          # The runner echoes every env value into the public log, and the
          # payload carries the file id.
          EVENT_PATH: ${{ github.event_path }}
          SELFTEST: ${{ inputs.selftest }}
        run: |
          set +x
          python process.py

  notify:
    # A separate job on purpose. When the process job is killed by its own
    # timeout, its remaining steps never execute, so an `if: failure()` step
    # inside that job would never fire for the one case that matters most.
    # A dependent job is still scheduled when the job it needs has failed.
    needs: [process]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send a Telegram notice
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          # Built from public values only, so it is safe to put in the message.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          # The script text is printed in the log, so the token appears here only
          # as ${TELEGRAM_BOT_TOKEN}. curl is used rather than Python because this
          # has to work even when the dependency install is what failed.
          # Only the status code is echoed; the response body is discarded, and
          # curl exit 0 alone would not prove Telegram accepted the message.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ALLOWED_CHAT_ID}" \
            --data-urlencode "text=media-utils-lab: a run failed (${EVENT_NAME}). ${RUN_URL}" \
            || true)
          echo "telegram notice: http ${code:-no-response}"
