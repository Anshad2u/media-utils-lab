name: digest

# A scheduled read of the private archive, plus manual runs.
#
# `schedule` is the one trigger in this repository that is not a dispatch, and it
# is safe for the same reason the dispatches are: it carries no input from
# outside. Nothing a caller sends can reach it, so it cannot be used to make the
# runner do something on demand. It is not a second way in; it is a timer.
#
# The schedule is UTC, and 21:15Z is 00:15 at UTC+3 - just after midnight local,
# so the run covers a day that has completely finished. A digest for a day that
# is still happening would be a partial answer wearing a complete one's clothes.
# Set the LOCAL_TZ repository variable to match, or the day boundary is UTC.
on:
  schedule:
    - cron: "15 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Local date to compile, YYYY-MM-DD. Blank means yesterday.
        type: string
        default: ""
      dry_run:
        description: Summarise without sending anything
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # queue: max rather than the default, for the same reason as process.yml: the
  # default cancels a pending run, and a digest that silently never ran is
  # indistinguishable from a day with nothing in it. Digests are idempotent, so
  # letting two queue is harmless; dropping one is not.
  group: digest
  queue: max

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Deliberately not requirements.txt. That file carries torch and
        # speechbrain, which this job never loads, and pulling several hundred
        # megabytes to concatenate some text is a waste of ten minutes a night.
        # Nothing archive-specific is needed: the archive is read with git over
        # ssh, both of which are already on the image.
        run: |
          set +x
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet requests==2.32.3

      - name: Compile the day
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          # Read access to the private archive, through the same deploy key the
          # writer uses. If these are absent the job says so and stops; nothing
          # else in the pipeline depends on them.
          ARCHIVE_SSH_KEY: ${{ secrets.ARCHIVE_SSH_KEY }}
          ARCHIVE_REPO: ${{ secrets.ARCHIVE_REPO }}
          LOCAL_TZ: ${{ vars.LOCAL_TZ }}
          # Inputs are passed through the environment rather than interpolated
          # into the script text, so a value can never become part of the shell
          # command that runs.
          WANT_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +x
          args=()
          if [ -n "${WANT_DATE}" ]; then args+=(--date "${WANT_DATE}"); fi
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          python digest.py "${args[@]}"

  notify:
    # Same reasoning as process.yml: a job killed by its own timeout never runs
    # its remaining steps, so a failure hook inside the job would miss the case
    # that matters most. A digest that never arrives must not be silent, because
    # silence is what a day with no recordings also looks like.
    needs: [digest]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send a Telegram notice
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ALLOWED_CHAT_ID}" \
            --data-urlencode "text=media-utils-lab: the day digest failed. ${RUN_URL}" \
            || true)
          echo "telegram notice: http ${code:-no-response}"
